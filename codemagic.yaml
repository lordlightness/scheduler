workflows:
  android-apk:
    name: Android APK
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Generate platform folders (android/ not committed to repo)
        script: flutter create . --platforms=android
      - name: Get dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release --split-per-abi
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
